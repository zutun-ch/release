# CI for the release tooling: the unit tests (against the platform's shared test vectors),
# actionlint on the workflows, and ShellCheck on the shell scripts. The release workflows
# themselves run only when a module or platform repo calls them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab, to rerun without a commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The platform repo is private. The organisation's GitHub App issues a read-only token for
      # this job; it's revoked when the job ends.
      - name: Token for the platform repo
        id: platform-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: read

      # The artifact-signature vectors and the host manifest example live there.
      - name: Check out the platform repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/platform
          path: .platform
          token: ${{ steps.platform-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: node --test
        env:
          PLATFORM_DIR: .platform
        run: node --test 'test/*.test.mjs'

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, pinned by digest; it runs ShellCheck on every run: block too.
      # .github/actionlint.yaml lists what it doesn't know yet.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Preinstalled on the runner.
      - name: ShellCheck
        run: shellcheck --shell=sh scripts/*.sh
