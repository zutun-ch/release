# Builds the images of a release repo for linux/amd64 and linux/arm64 (MANIFEST §10). For a
# release it pushes them to ghcr.io, tagged v<N>, and checks that each package is public
# before anything is signed: servers pull without credentials. On other refs it only builds.
# The scripts live next to this action, in the release tooling the workflow checked out.
name: Images
description: Build (and for a release push) the images of the repo in the workspace.

inputs:
  images:
    description: The plan's images, JSON [{ name, context, repository }].
    required: true
  version:
    description: The release version; empty builds without pushing.
    required: true
  token:
    description: A token that may push the packages (the job's GITHUB_TOKEN with packages write).
    required: true

outputs:
  digests:
    description: JSON map of image repository to its pushed digest (null when nothing was pushed).
    value: ${{ steps.build.outputs.digests }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # QEMU runs the build steps of the other architecture; buildx builds both into one index.
    # Both run tools from images that go into every arm64 build: the emulator (installed by a
    # privileged container) and BuildKit, which runs the whole build. The actions default to
    # moving tags (binfmt:latest, buildkit:buildx-stable-1) and cache the binfmt image in the
    # repo's Actions cache, which other workflows of the repo can write; so both images are
    # pinned by digest, bumped by hand, and nothing comes from the cache.
    - name: Set up QEMU
      if: inputs.images != '[]'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
        cache-image: false
    - name: Set up Docker Buildx
      if: inputs.images != '[]'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

    - name: Log in to ghcr.io
      if: inputs.images != '[]' && inputs.version != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        ACTOR: ${{ github.actor }}
      run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

    - name: Build
      id: build
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        VERSION: ${{ inputs.version }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/build-images.mjs" --images "$IMAGES" --version "$VERSION"

    - name: Check the packages are public
      if: inputs.images != '[]' && inputs.version != ''
      shell: bash
      env:
        DIGESTS: ${{ steps.build.outputs.digests }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/check-public.mjs" --digests "$DIGESTS"
